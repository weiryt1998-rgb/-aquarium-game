# Build the game with Vite and publish dist/ on Netlify.
# Firebase web config (VITE_* variables) is set in Netlify → Site configuration → Environment variables.
# See docs/CLOUD_SAVE.md — never put the game password or service account keys in these variables.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
