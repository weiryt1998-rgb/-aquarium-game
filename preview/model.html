<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>ตรวจโมเดล .glb</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Kanit', system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b2233;
        color: #eaf6ff;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        max-width: min(420px, calc(100vw - 24px));
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(6, 22, 34, 0.8);
        font-size: 14px;
        line-height: 1.5;
      }
      #panel h1 {
        margin: 0 0 6px;
        font-size: 17px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 6px 0;
      }
      button,
      input {
        font: inherit;
        padding: 4px 10px;
        border: 1px solid #2f6a86;
        border-radius: 8px;
        background: #12384c;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button.active {
        background: #2b8bb8;
        border-color: #9fdcff;
      }
      #url {
        flex: 1;
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="panel">
      <h1>🔍 ตรวจโมเดล .glb</h1>
      <div>ลูกศรแดง = +Z (ทิศหัวที่เกมใช้) · เขียว = +Y (ด้านบน) · ฟ้า = +X</div>
      <div class="row"><input id="url" placeholder="models/decor/cliff_sanctuary.glb" /><button id="load">โหลด</button></div>
      <div class="row" id="views"></div>
      <div id="info"></div>
    </div>
    <script type="module" src="./model-preview.js"></script>
  </body>
</html>
