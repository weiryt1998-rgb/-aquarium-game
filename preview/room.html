<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>ทดสอบฉากห้อง</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Kanit', system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #06202e;
        color: #e8f4fa;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        max-width: min(360px, calc(100vw - 24px));
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(4, 20, 30, 0.78);
        backdrop-filter: blur(6px);
        font-size: 14px;
      }
      #panel h1 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      #panel .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 6px 0;
      }
      #panel.hidden .row,
      #panel.hidden #stats {
        display: none;
      }
      button {
        font: inherit;
        padding: 3px 9px;
        border: 1px solid #3b6a80;
        border-radius: 8px;
        background: #0f3346;
        color: inherit;
        cursor: pointer;
      }
      button.active {
        background: #2e8bb5;
        border-color: #7cd0f0;
      }
      #stats {
        color: #9fe0a8;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="panel">
      <h1>🛋️ ฉากห้อง <button id="toggle" title="ซ่อน/แสดง">–</button></h1>
      <div class="row" id="tanks"></div>
      <div class="row" id="views"></div>
      <div class="row" id="qualities"></div>
      <div id="stats"></div>
    </div>
    <script type="module" src="./room-preview.js"></script>
  </body>
</html>
