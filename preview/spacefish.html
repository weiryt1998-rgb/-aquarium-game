<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>ทดสอบโมเดลปลาอวกาศ</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Kanit', system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #050a1c;
        color: #eef0ff;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        max-width: min(380px, calc(100vw - 24px));
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(10, 8, 30, 0.78);
        backdrop-filter: blur(6px);
        font-size: 14px;
        line-height: 1.5;
      }
      #panel h1 {
        margin: 0 0 6px;
        font-size: 17px;
      }
      #panel .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin: 6px 0;
      }
      button {
        font: inherit;
        padding: 4px 10px;
        border: 1px solid #4a3f80;
        border-radius: 8px;
        background: #1a1440;
        color: inherit;
        cursor: pointer;
      }
      button.active {
        background: #6a4cd8;
        border-color: #c4a8ff;
      }
      #fps {
        font-variant-numeric: tabular-nums;
        color: #9fe7a6;
      }
      #hide {
        position: absolute;
        top: 8px;
        right: 10px;
        padding: 0 8px;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="panel">
      <button id="hide" title="ซ่อน/แสดงแผง">–</button>
      <h1>🌌 Space Fish (ปลาอวกาศ)</h1>
      <div id="body">
        <div class="row" id="modes"></div>
        <div class="row" id="views"></div>
        <div class="row" id="variants"></div>
        <div class="row" id="details"></div>
        <div class="row">
          <button id="pause">หยุดชั่วคราว</button>
          <span id="fps"></span>
        </div>
      </div>
    </div>
    <script type="module" src="./spacefish-preview.js"></script>
  </body>
</html>
