<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>ตรวจกระถางทานตะวัน</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Kanit', system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #24476f;
        color: #eaf6ff;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        width: min(330px, calc(100vw - 24px));
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(6, 22, 34, 0.8);
        font-size: 14px;
        line-height: 1.5;
      }
      #panel h1 {
        margin: 0 0 6px;
        font-size: 17px;
      }
      label {
        display: grid;
        grid-template-columns: 92px 1fr 42px;
        align-items: center;
        gap: 6px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 6px 0;
      }
      button {
        font: inherit;
        padding: 4px 10px;
        border: 1px solid #2f6a86;
        border-radius: 8px;
        background: #12384c;
        color: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="panel">
      <h1>🌻 กระถางทานตะวัน</h1>
      <div id="sliders"></div>
      <div class="row" id="stages"></div>
      <div class="row" id="actions"></div>
      <div id="info"></div>
    </div>
    <script type="module" src="./sunflower-preview.js"></script>
  </body>
</html>
